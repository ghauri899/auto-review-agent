name: Automatic PR Code Review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

# Cancel a still-running review for this PR when a new commit is pushed —
# the old review would just be reviewing stale code anyway, and this frees
# up a runner slot instead of letting superseded runs queue alongside new
# ones (this workflow is shared across many repos in the org, so runner
# contention adds up fast).
concurrency:
  group: claude-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # `$/` loads the composite action from this private repo at the same
      # commit the caller pinned. No extra checkout or PAT is needed, and
      # a SHA-pinned caller cannot silently pick up a newer script from main.
      - name: Run Inspector G
        uses: $/.github/actions/inspector-g
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
