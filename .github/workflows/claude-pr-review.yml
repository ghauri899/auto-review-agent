name: Automatic PR Code Review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

# Cancel a still-running review for this PR when a new commit is pushed —
# the old review would just be reviewing stale code anyway, and this frees
# up a runner slot instead of letting superseded runs queue alongside new
# ones (this workflow is shared across many repos in the org, so runner
# contention adds up fast).
concurrency:
  group: claude-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff from the actual fork point (merge-base) of this PR's base/head
          # commits, not from base.sha directly. base.sha is the *live tip* of the
          # target branch — if other PRs have merged into it since this branch was
          # created, diffing straight against base.sha pulls in those unrelated
          # catch-up changes as if they were part of this PR. Computing the
          # merge-base of these two fixed, PR-specific commits (rather than
          # resolving a moving branch ref like origin/dev) also avoids the
          # "multiple merge bases" ambiguity seen on branches with a criss-cross
          # history. This matches exactly what GitHub's own "Files changed" tab
          # shows.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write review script
        run: |
          cat <<'REVIEW_SCRIPT_EOF' > /tmp/claude-review.js
          #!/usr/bin/env node

          import fs from 'fs';

          const diffPath = process.argv[2];
          if (!diffPath) {
            console.error('Usage: node claude-review.js <diff-file-path>');
            process.exit(1);
          }

          const diff = fs.readFileSync(diffPath, 'utf8');

          if (!diff.trim()) {
            fs.writeFileSync('/tmp/review.txt', 'No changes detected against the base branch — nothing to review.');
            process.exit(0);
          }

          const MAX_DIFF_CHARS = 200_000;
          const truncated = diff.length > MAX_DIFF_CHARS;
          const diffForReview = truncated ? diff.slice(0, MAX_DIFF_CHARS) : diff;

          let prTitle = '';
          try {
            prTitle = process.env.PR_TITLE ? JSON.parse(process.env.PR_TITLE) : '';
          } catch {
            prTitle = process.env.PR_TITLE || '';
          }

          const systemPrompt = `You are an expert software engineer and security reviewer conducting a strict, low-noise review of a pull request diff.

          Focus only on:
          - Security vulnerabilities (injection, auth bypass, secrets exposure, XSS, SSRF, path traversal, insecure deserialization)
          - Bugs and logic errors, race conditions, unhandled edge cases, guaranteed crashes
          - Breaking changes to public APIs or contracts
          - Data integrity issues (incorrect DB operations, data loss risk)
          - Meaningful performance problems (N+1 queries, unbounded loops, memory leaks) with production-scale impact

          Only classify something as CRITICAL or HIGH if you can state the concrete failure mode or exploit path in exactly one sentence. If you cannot, it is MEDIUM or lower.

          Do not comment on formatting, naming conventions, or style preferences as must-fix. Do not use hedge words like "might", "could", "consider", "maybe" — state findings directly, or omit them if you're not sure they're real. Do not praise the code or restate what it does beyond a one-line summary.

          Report at most 8 issues total, prioritizing CRITICAL and HIGH first. Keep each "description" and "fix" to 2-3 sentences — this output must fit in the token budget without being cut off mid-response.

          Return a single JSON object only. No markdown fences, no preamble, nothing outside the JSON.

          {
            "summary": "2-3 sentence executive summary of the PR and its overall risk",
            "score": <number 0.0-5.0, one decimal, overall quality score>,
            "score_breakdown": {
              "security": <0-5>,
              "correctness": <0-5>,
              "performance": <0-5>,
              "maintainability": <0-5>,
              "best_practices": <0-5>
            },
            "score_rationale": "1-2 sentences. Be direct. If a score is low, state the specific reason.",
            "risk_level": "CRITICAL|HIGH|MEDIUM|LOW",
            "issues": [
              {
                "severity": "CRITICAL|HIGH|MEDIUM|LOW",
                "category": "SECURITY|BUG|PERFORMANCE|DATA_INTEGRITY|BREAKING_CHANGE|BEST_PRACTICE",
                "file": "path/to/file.ext",
                "line_reference": "L42" or "L42-L55" or null,
                "title": "Short title, no hedge words",
                "failure_mode": "Exactly one sentence: the concrete failure mode or exploit path. Required for CRITICAL/HIGH, null for MEDIUM/LOW.",
                "description": "Why this is a problem, grounded in the diff",
                "fix": "Minimal fix. Code snippet only if the fix is non-obvious."
              }
            ],
            "test_evidence": {
              "found": true or false,
              "detail": "What test evidence is visible in the diff (test files changed, coverage notes, CI output), or null if none"
            },
            "best_practices_notes": ["at most 3 short, practical, non-blocking observations"]
          }`;

          const userPrompt = `Review this Pull Request. Apply the strict low-noise standard: only report CRITICAL or HIGH if you can state the concrete failure mode in one sentence.

          PR Title: ${prTitle || 'N/A'}

          ${truncated ? 'Note: this diff was truncated to the first 200,000 characters.\n\n' : ''}Diff:
          \`\`\`diff
          ${diffForReview}
          \`\`\``;

          // --- Shields.io badge + progress-bar helpers -------------------------------
          // Literal '-' and ' ' are field separators in a shields.io static badge URL,
          // so label/message text has to be escaped before it's interpolated.
          function shieldEscape(s) {
            return String(s).replace(/-/g, '--').replace(/_/g, '__').replace(/ /g, '_');
          }

          function badge(label, message, color) {
            const l = encodeURIComponent(shieldEscape(label));
            const m = encodeURIComponent(shieldEscape(message));
            return `![${label}: ${message}](https://img.shields.io/badge/${l}-${m}-${color}?style=for-the-badge&labelColor=1a1a2e)`;
          }

          function scoreColor(score) {
            if (score >= 4.5) return '2ea043';
            if (score >= 3.5) return '57ab5a';
            if (score >= 2.5) return 'e3b341';
            if (score >= 1.5) return 'e0823d';
            return 'da3633';
          }

          const RISK_COLOR = { CRITICAL: 'da3633', HIGH: 'e0823d', MEDIUM: 'e3b341', LOW: '2ea043' };
          const RISK_EMOJI = { CRITICAL: '🚨', HIGH: '🔴', MEDIUM: '🟡', LOW: '🟢' };

          function progressBar(score, max = 5, width = 10) {
            const filled = Math.round((score / max) * width);
            return '█'.repeat(Math.max(0, filled)) + '░'.repeat(Math.max(0, width - filled));
          }

          function severityMeta(severity) {
            return {
              CRITICAL: { emoji: '🔴', label: 'CRITICAL' },
              HIGH: { emoji: '🟠', label: 'HIGH' },
              MEDIUM: { emoji: '🟡', label: 'MEDIUM' },
              LOW: { emoji: '🔵', label: 'LOW' },
            }[severity] || { emoji: '⚪', label: severity || 'UNKNOWN' };
          }

          function issueCard(issue, { open }) {
            const { emoji } = severityMeta(issue.severity);
            const location = issue.line_reference ? `${issue.file}:${issue.line_reference}` : issue.file;
            let card = `<details${open ? ' open' : ''}>\n`;
            card += `<summary>${emoji} <b>${issue.title}</b> &nbsp;<sub><code>${location}</code></sub></summary>\n\n`;
            card += `&nbsp;\n\n`;
            card += `| | |\n|:--|:--|\n`;
            card += `| **Severity** | ${issue.severity} |\n`;
            card += `| **Category** | ${issue.category} |\n`;
            if (issue.failure_mode) card += `| **Failure mode** | ${issue.failure_mode} |\n`;
            card += `\n**What's wrong**\n\n${issue.description}\n\n`;
            card += `**Suggested fix**\n\n${issue.fix}\n\n`;
            card += `</details>\n\n`;
            return card;
          }

          function formatReviewComment(review) {
            const issues = review.issues || [];
            const mustFix = issues.filter((i) => i.severity === 'CRITICAL' || i.severity === 'HIGH');
            const advisory = issues.filter((i) => i.severity === 'MEDIUM' || i.severity === 'LOW');
            const breakdown = review.score_breakdown || {};
            const riskEmoji = RISK_EMOJI[review.risk_level] || '⚪';
            const riskColor = RISK_COLOR[review.risk_level] || '8b949e';

            const scoreBadge = badge('Quality Score', `${review.score}/5`, scoreColor(review.score));
            const riskBadge = badge('Risk', review.risk_level || 'N/A', riskColor);

            let md = `<div align="center">\n\n${scoreBadge} ${riskBadge}\n\n</div>\n\n`;

            md += `> **${riskEmoji} ${review.summary || 'N/A'}**\n\n`;

            md += `<details open>\n<summary><b>📊 Score Breakdown</b></summary>\n\n&nbsp;\n\n`;
            md += `| Dimension | | Score |\n|:--|:--|:--:|\n`;
            const dims = [
              ['🔒 Security', breakdown.security],
              ['✔️ Correctness', breakdown.correctness],
              ['⚡ Performance', breakdown.performance],
              ['🔧 Maintainability', breakdown.maintainability],
              ['📐 Best Practices', breakdown.best_practices],
            ];
            for (const [label, value] of dims) {
              const bar = value == null ? '—' : `\`${progressBar(value)}\``;
              md += `| ${label} | ${bar} | ${value ?? 'N/A'}/5 |\n`;
            }
            md += `\n`;
            if (review.score_rationale) md += `*${review.score_rationale}*\n\n`;
            md += `</details>\n\n---\n\n`;

            if (mustFix.length > 0) {
              md += `### 🚫 Must-Fix Issues (${mustFix.length})\n\n`;
              for (const issue of mustFix) md += issueCard(issue, { open: true });
            } else {
              md += `### ✅ No Must-Fix Issues\n\nNo CRITICAL or HIGH severity issues found.\n\n`;
            }

            if (advisory.length > 0) {
              md += `### 🔵 Advisory Issues (${advisory.length}, non-blocking)\n\n`;
              for (const issue of advisory) md += issueCard(issue, { open: false });
            }

            const footerBits = [];
            if (review.test_evidence) {
              footerBits.push(
                `**🧪 Test Evidence**\n${
                  review.test_evidence.found
                    ? review.test_evidence.detail
                    : '⚠️ No test results visible in this diff. Not required, but helpful before merge.'
                }`
              );
            }
            if (review.best_practices_notes?.length > 0) {
              footerBits.push(
                `**💡 Best Practices**\n${review.best_practices_notes.slice(0, 3).map((n) => `- ${n}`).join('\n')}`
              );
            }
            if (footerBits.length > 0) md += `---\n\n${footerBits.join('\n\n')}\n\n`;

            return md.trim();
          }

          async function main() {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
              },
              body: JSON.stringify({
                model: 'claude-opus-5-5',
                // Bumped from 16000: adaptive thinking now shares this budget, so
                // there needs to be enough headroom left for the full JSON output
                // even after Claude spends some of it deliberating.
                max_tokens: 30000,
                // Adaptive thinking with effort:medium keeps some reasoning depth
                // (helps on subtler bugs) while biasing away from the kind of
                // open-ended deliberation that previously consumed the entire
                // token budget on a complex diff before any review text was
                // written (stop_reason: max_tokens, empty thinking block, no
                // text output at all).
                thinking: { type: 'adaptive' },
                output_config: { effort: 'medium' },
                system: systemPrompt,
                messages: [{ role: 'user', content: userPrompt }],
              }),
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Anthropic API error ${response.status}: ${errText}`);
            }

            const data = await response.json();

            if (data.stop_reason === 'refusal') {
              fs.writeFileSync('/tmp/review.txt', '⚠️ Claude declined to review this diff (safety classifier refusal). This is usually a false positive on security-adjacent code — re-run the workflow to retry.');
              console.log('Claude refused the request (stop_reason: refusal). Wrote fallback message.');
              return;
            }

            const textBlock = data.content?.find((block) => block.type === 'text');

            if (!textBlock) {
              throw new Error(`No text content in Claude response. stop_reason: ${data.stop_reason}, content: ${JSON.stringify(data.content)}`);
            }

            let review;
            try {
              const cleaned = textBlock.text.replace(/^```json\n?|\n?```$/g, '').trim();
              review = JSON.parse(cleaned);
            } catch (err) {
              if (data.stop_reason === 'max_tokens') {
                fs.writeFileSync('/tmp/review.txt', '⚠️ The review was too long and got cut off before it finished (hit the token limit). This usually means the PR has many findings — try splitting it into smaller PRs, or re-run the workflow.');
                console.log('Response truncated at max_tokens before JSON completed. Wrote fallback message.');
                return;
              }
              console.error('Failed to parse Claude response as JSON. Raw text:', textBlock.text);
              throw err;
            }

            fs.writeFileSync('/tmp/review.txt', formatReviewComment(review));
            fs.writeFileSync('/tmp/review.json', JSON.stringify(review));
            console.log(`Review written to /tmp/review.txt. Score: ${review.score}/5, risk: ${review.risk_level}`);
          }

          main().catch((err) => {
            // Catch-all: never let an unhandled error kill the job with no PR feedback.
            // Full details go to the Action log; the PR comment gets a short, honest notice.
            console.error('Claude review failed with an unexpected error:');
            console.error(err.stack || err.message || String(err));
            fs.writeFileSync(
              '/tmp/review.txt',
              `⚠️ The automated review could not be completed due to an unexpected error: ${err.message || String(err)}\n\nCheck the "Run Claude code review" step logs in the Actions run for full details.`
            );
          });
          REVIEW_SCRIPT_EOF

      - name: Run Claude code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ toJSON(github.event.pull_request.title) }}
        run: node /tmp/claude-review.js /tmp/pr.diff

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');

            const body = [
              '<div align="center">',
              '',
              `<svg xmlns="http://www.w3.org/2000/svg" width="205" height="48" fill="none" viewBox="0 0 205 48"><path fill="#fff" d="M81.38 34.162c1.422.617 3.642 1.168 6.02 1.168 2.967 0 4.537-1.107 4.537-3.019 0-1.937-1.483-2.738-4.23-3.385-4.445-1.015-6.67-2.677-6.67-6.466 0-3.691 2.41-6.465 7.596-6.465 2.716 0 4.169.398 5.96 1.076l-.216 3.941c-1.851-.617-3.457-.984-5.56-.984-2.654 0-3.954 1.107-3.954 2.616 0 1.417.926 2.187 4.046 2.957 4.323 1.015 6.854 2.524 6.854 6.557 0 3.82-2.378 6.74-8.153 6.74-3.028 0-4.665-.524-6.455-1.228l.225-3.508zM99.994 25.729h-2.747V22.25h2.967l.434-4.216h2.931v4.216h4.542v3.478h-4.542v7.169c0 1.968.987 2.676 2.471 2.676a6.66 6.66 0 002.066-.305l.276 3.202c-.741.275-1.882.428-2.966.428-3.985 0-5.432-2.249-5.432-5.787v-7.383zM116.914 25.632c-1.974 0-3.831.556-5.156 1.198l-.276-3.6c1.422-.77 3.458-1.356 5.806-1.356 4.91 0 6.884 2.371 6.884 6.277v10.376H120.5v-2.31c-1.171 1.54-2.655 2.677-5.248 2.677-2.778 0-4.849-1.479-4.849-4.217 0-3.324 2.44-4.43 6.332-5.078 1.484-.245 2.379-.464 3.09-.8.496-.215.588-.495.588-.985-.01-1.29-1.059-2.182-3.499-2.182zm.466 6.129c-2.097.397-3.213.923-3.213 2.554 0 1.418 1.177 2.096 2.625 2.096 1.851 0 3.15-1.168 3.703-2.494v-3.14c-.614.367-1.76.734-3.115.984zM142.576 38.532h-3.519v-2.401h-.092c-.926 1.662-2.471 2.768-4.88 2.768-4.199 0-6.174-2.86-6.174-6.802v-9.85h3.581v8.928c0 2.554 1.048 4.4 3.678 4.4 2.593 0 3.831-1.938 3.831-4.62v-8.708h3.58v16.285h-.005zM147.082 22.247h3.52v2.462h.092c.956-1.693 2.624-2.83 5.125-2.83 4.261 0 6.174 2.86 6.174 6.802v9.851h-3.581V30.16c0-2.585-1.11-4.462-3.831-4.462-2.624 0-3.923 1.816-3.923 4.615v8.219h-3.581V22.247h.005zM178.325 37.915c-1.14.586-2.685.984-4.322.984-5.253 0-8.772-3.233-8.772-8.586 0-4.926 3.181-8.434 8.552-8.434 1.79 0 3.304.398 4.445.923l-.307 3.63c-.987-.525-2.286-.8-3.734-.8-3.212 0-5.217 2.03-5.217 4.895 0 3.08 2.102 5.048 5.279 5.048a8.796 8.796 0 003.8-.862l.276 3.202zM189.287 25.54c-2.624 0-3.924 1.815-3.924 4.615v8.372h-3.58V15.139h3.519v9.417h.092c.926-1.632 2.563-2.677 5.033-2.677 4.292 0 6.271 2.86 6.271 6.802v9.85h-3.58v-8.524c0-2.585-1.115-4.467-3.831-4.467zM67.079 22.73l-.256-1.198-1.207.245a43.394 43.394 0 00-7.151 2.106V12.63h-1.238c-3.253 0-6.307 1.26-8.598 3.554a12.139 12.139 0 00-2.578 3.783c-2.834-7.572-6.599-15.424-6.84-15.929l-1.007-2.095-1.181 2.004c-3.335 5.675-5.683 11.13-7.3 15.622a12.132 12.132 0 00-2.383-3.37 12.103 12.103 0 00-8.599-3.554h-1.237V23.99a42.928 42.928 0 00-7.427-2.218l-1.207-.245-.256 1.204c-.03.142-2.819 14.077 8.89 20.349v.025l.695.337c.742.362 1.525.678 2.348.969l.118.046.102.03c2.578.867 5.535 1.382 8.839 1.525.655.03 1.32.04 2.005.04 1.939 0 4.01-.117 6.169-.346l.061-.005.061.005c2.164.23 4.23.346 6.174.346.783 0 1.545-.02 2.282-.056 4.48-.224 8.322-1.132 11.421-2.702l.676-.342v-.025c11.401-6.333 8.654-20.054 8.624-20.196zm-16.696-4.797a9.567 9.567 0 015.601-2.749v9.765a39.62 39.62 0 00-7.1 4.288c-.281-1.453-.741-3.141-1.32-4.936a9.556 9.556 0 012.82-6.368zM37.99 7.266c2.358 5.114 8.072 17.963 8.665 23.78-.409.358-.808.725-1.202 1.097-4.02 3.824-6.414 7.648-7.606 9.892-1.166-2.188-3.473-5.88-7.32-9.612a42.74 42.74 0 00-1.508-1.381c.245-1.25 2.445-11.921 8.971-23.776zM25.591 17.953a9.596 9.596 0 012.767 5.741 76.696 76.696 0 00-1.499 5.584 40.006 40.006 0 00-6.875-4.197V15.2a9.646 9.646 0 015.606 2.753zM10.853 24.48a40.618 40.618 0 016.65 2.192v13.542c-7.09-4.594-6.987-12.65-6.65-15.734zm18.864 19.059c-.496-.02-.982-.051-1.457-.092l-.471-.046c-.312-.03-.624-.061-.93-.097-.185-.02-.364-.05-.548-.076a33.673 33.673 0 01-.803-.117c-.19-.031-.374-.067-.563-.102a31.366 31.366 0 01-.731-.143c-.19-.041-.374-.082-.558-.128l-.68-.168a74.95 74.95 0 01-.542-.153c-.215-.061-.43-.127-.64-.199-.174-.056-.348-.112-.516-.173-.205-.072-.41-.148-.61-.23a13.883 13.883 0 01-.485-.193c-.072-.03-.133-.062-.205-.092V27.84a37.456 37.456 0 018.814 6.353c3.723 3.61 5.928 7.24 6.966 9.218-2.138.169-4.169.215-6.04.128zm10.205-.128c1.064-2.024 3.35-5.782 7.238-9.473a37.265 37.265 0 018.823-6.241v13.705c-.072.036-.143.067-.215.102-.153.067-.312.133-.47.2l-.624.244c-.164.061-.328.117-.497.178-.214.072-.434.143-.66.215-.173.05-.342.102-.516.152-.23.067-.466.128-.7.184a27.678 27.678 0 01-1.289.285l-.543.108c-.271.046-.547.086-.823.132-.174.026-.348.056-.522.077-.317.04-.64.076-.962.107-.148.015-.291.035-.445.046-.48.04-.967.076-1.463.102a50.503 50.503 0 01-6.332-.123zm18.542-3.385V26.55a39.576 39.576 0 016.368-2.076c.338 3.05.445 10.937-6.368 15.552z"></path></svg>`,
              '',
              '### 🕵️ Inspector G — Automated Code Review',
              '',
              '</div>',
              '',
              review,
              '',
              '<div align="center">',
              '',
              '<sub>Reviewed by <b>Inspector G</b> · powered by <a href="https://claude.ai">Claude</a></sub>',
              '',
              '</div>'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            // Inline review comments for CRITICAL/HIGH (must-fix) issues.
            if (!fs.existsSync('/tmp/review.json')) return;

            const parsedReview = JSON.parse(fs.readFileSync('/tmp/review.json', 'utf8'));
            const mustFixIssues = (parsedReview.issues || []).filter(
              (issue) => (issue.severity === 'CRITICAL' || issue.severity === 'HIGH') && issue.file && issue.line_reference
            );

            if (mustFixIssues.length === 0) return;

            const INLINE_MARKER = '<!-- claude-inline-review -->';

            function parseLineRef(ref) {
              const match = /^L(\d+)(?:-L(\d+))?$/.exec(ref || '');
              if (!match) return null;
              const start = parseInt(match[1], 10);
              const end = match[2] ? parseInt(match[2], 10) : start;
              return end > start ? { start_line: start, start_side: 'RIGHT', line: end } : { line: start };
            }

            // Clean up inline comments from previous runs on this PR to avoid duplicates on re-push.
            const existingComments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            for (const comment of existingComments.data) {
              if (comment.user?.type === 'Bot' && comment.body.includes(INLINE_MARKER)) {
                try {
                  await github.rest.pulls.deleteReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                } catch (err) {
                  console.log(`Could not delete stale inline comment ${comment.id}: ${err.message}`);
                }
              }
            }

            const headSha = context.payload.pull_request.head.sha;
            const MAX_INLINE_COMMENTS = 15;

            for (const issue of mustFixIssues.slice(0, MAX_INLINE_COMMENTS)) {
              const lineInfo = parseLineRef(issue.line_reference);
              if (!lineInfo) continue;

              const sevEmoji = issue.severity === 'CRITICAL' ? '🔴' : '🟠';
              const bodyLines = [`${sevEmoji} **${issue.severity}: ${issue.title}**`, ''];
              if (issue.failure_mode) bodyLines.push(`**Failure mode:** ${issue.failure_mode}`, '');
              bodyLines.push(`**Fix:** ${issue.fix}`, '', INLINE_MARKER);
              const commentBody = bodyLines.join('\n');

              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: headSha,
                  path: issue.file,
                  side: 'RIGHT',
                  body: commentBody,
                  ...lineInfo
                });
              } catch (err) {
                console.log(`Could not post inline comment on ${issue.file}:${issue.line_reference} — ${err.message}`);
              }
            }
