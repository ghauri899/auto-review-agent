name: Automatic PR Code Review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

# Cancel a still-running review for this PR when a new commit is pushed —
# the old review would just be reviewing stale code anyway, and this frees
# up a runner slot instead of letting superseded runs queue alongside new
# ones (this workflow is shared across many repos in the org, so runner
# contention adds up fast).
concurrency:
  group: claude-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff from the actual fork point (merge-base) of this PR's base/head
          # commits, not from base.sha directly. base.sha is the *live tip* of the
          # target branch — if other PRs have merged into it since this branch was
          # created, diffing straight against base.sha pulls in those unrelated
          # catch-up changes as if they were part of this PR. Computing the
          # merge-base of these two fixed, PR-specific commits (rather than
          # resolving a moving branch ref like origin/dev) also avoids the
          # "multiple merge bases" ambiguity seen on branches with a criss-cross
          # history. This matches exactly what GitHub's own "Files changed" tab
          # shows.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write review script
        run: |
          cat <<'REVIEW_SCRIPT_EOF' > /tmp/claude-review.js
          #!/usr/bin/env node

          import fs from 'fs';

          const diffPath = process.argv[2];
          if (!diffPath) {
            console.error('Usage: node claude-review.js <diff-file-path>');
            process.exit(1);
          }

          const diff = fs.readFileSync(diffPath, 'utf8');

          if (!diff.trim()) {
            fs.writeFileSync('/tmp/review.txt', 'No changes detected against the base branch — nothing to review.');
            process.exit(0);
          }

          const MAX_DIFF_CHARS = 200_000;
          const truncated = diff.length > MAX_DIFF_CHARS;
          const diffForReview = truncated ? diff.slice(0, MAX_DIFF_CHARS) : diff;

          let prTitle = '';
          try {
            prTitle = process.env.PR_TITLE ? JSON.parse(process.env.PR_TITLE) : '';
          } catch {
            prTitle = process.env.PR_TITLE || '';
          }

          const systemPrompt = `You are an expert software engineer and security reviewer conducting a strict, low-noise review of a pull request diff.

          Focus only on:
          - Security vulnerabilities (injection, auth bypass, secrets exposure, XSS, SSRF, path traversal, insecure deserialization)
          - Bugs and logic errors, race conditions, unhandled edge cases, guaranteed crashes
          - Breaking changes to public APIs or contracts
          - Data integrity issues (incorrect DB operations, data loss risk)
          - Meaningful performance problems (N+1 queries, unbounded loops, memory leaks) with production-scale impact

          Only classify something as CRITICAL or HIGH if you can state the concrete failure mode or exploit path in exactly one sentence. If you cannot, it is MEDIUM or lower.

          Do not comment on formatting, naming conventions, or style preferences as must-fix. Do not use hedge words like "might", "could", "consider", "maybe" — state findings directly, or omit them if you're not sure they're real. Do not praise the code or restate what it does beyond a one-line summary.

          Report at most 8 issues total, prioritizing CRITICAL and HIGH first. Keep each "description" and "fix" to 2-3 sentences — this output must fit in the token budget without being cut off mid-response.

          Additionally, write one original two-line Urdu couplet (in Urdu script) reacting to this specific PR's code quality. This must be genuinely funny, sharp, and top-class — written with the energy of a stand-up comedian doing a roast, or a witty Urdu satirist, not a generic greeting-card verse. Hard requirements:
          - The two lines MUST rhyme — the ending words need a real matching qafia/sound, not just thematic similarity. If the lines don't rhyme, rewrite them until they do.
          - It must land as a joke with a punchline in the second line, not just a flowery description. Favor a clever twist, unexpected comparison, or wordplay over a plain statement.
          - Tone scales with the score: a high score gets a proud, cocky, celebratory roast (bragging on the code's behalf); a low score gets a biting, comedic roast of the bugs/mess found — sharp and funny, not cruel to the person. Never insult the developer personally, but the CODE is fair game to roast hard.
          - Where natural, weave in a witty nod to the actual kind of issue found (security hole, crash, spaghetti logic, missing tests) — but keep it accessible, not technical jargon.
          - Do not reuse these examples verbatim — they only illustrate the required rhyme quality and comedic tone:
            - High score: "کوڈ ہے صاف چمکتا جیسے دھوپ میں شبنم کا قطرہ، ڈھونڈنے نکلا بگ کو ڈیبگر، مل نہ سکا کوئی خطرہ۔"
            - Low score: "کوڈ میں بگ بھرے ہیں جیسے بریانی میں تیل، ری ویو کر کے تھک گیا میں، یار یہ کوئی کھیل؟"
          Write a fresh, original couplet every time — never copy the examples above.

          Return a single JSON object only. No markdown fences, no preamble, nothing outside the JSON.

          {
            "summary": "2-3 sentence executive summary of the PR and its overall risk",
            "urdu_couplet": "Two rhyming lines of original Urdu poetry (Urdu script), roast-style stand-up comedian energy, per the hard requirements above — must actually rhyme and have a punchline",
            "score": <number 0.0-5.0, one decimal, overall quality score>,
            "score_breakdown": {
              "security": <0-5>,
              "correctness": <0-5>,
              "performance": <0-5>,
              "maintainability": <0-5>,
              "best_practices": <0-5>
            },
            "score_rationale": "1-2 sentences. Be direct. If a score is low, state the specific reason.",
            "risk_level": "CRITICAL|HIGH|MEDIUM|LOW",
            "issues": [
              {
                "severity": "CRITICAL|HIGH|MEDIUM|LOW",
                "category": "SECURITY|BUG|PERFORMANCE|DATA_INTEGRITY|BREAKING_CHANGE|BEST_PRACTICE",
                "file": "path/to/file.ext",
                "line_reference": "L42" or "L42-L55" or null,
                "title": "Short title, no hedge words",
                "failure_mode": "Exactly one sentence: the concrete failure mode or exploit path. Required for CRITICAL/HIGH, null for MEDIUM/LOW.",
                "description": "Why this is a problem, grounded in the diff",
                "fix": "Minimal fix. Code snippet only if the fix is non-obvious."
              }
            ],
            "test_evidence": {
              "found": true or false,
              "detail": "What test evidence is visible in the diff (test files changed, coverage notes, CI output), or null if none"
            },
            "best_practices_notes": ["at most 3 short, practical, non-blocking observations"]
          }`;

          const userPrompt = `Review this Pull Request. Apply the strict low-noise standard: only report CRITICAL or HIGH if you can state the concrete failure mode in one sentence.

          PR Title: ${prTitle || 'N/A'}

          ${truncated ? 'Note: this diff was truncated to the first 200,000 characters.\n\n' : ''}Diff:
          \`\`\`diff
          ${diffForReview}
          \`\`\``;

          function scoreBar(score) {
            const filled = Math.round(score);
            return '⭐'.repeat(filled) + '☆'.repeat(5 - filled);
          }

          function formatReviewComment(review) {
            const riskEmoji = { CRITICAL: '🚨', HIGH: '🔴', MEDIUM: '🟡', LOW: '🟢' }[review.risk_level] || '⚪';
            const issues = review.issues || [];
            const mustFix = issues.filter((i) => i.severity === 'CRITICAL' || i.severity === 'HIGH');
            const advisory = issues.filter((i) => i.severity === 'MEDIUM' || i.severity === 'LOW');
            const breakdown = review.score_breakdown || {};

            let md = '';
            if (review.urdu_couplet) {
              const coupletLines = review.urdu_couplet
                .split('\n')
                .filter((line) => line.trim())
                .map((line) => `> *${line.trim()}*`)
                .join('\n>\n');
              md += `📜 **2 lines for your PR**\n\n${coupletLines}\n\n---\n\n`;
            }

            md += `## 📊 Code Quality Score: ${review.score}/5 ${scoreBar(review.score)}\n\n`;
            md += `| Dimension | Score |\n|-----------|-------|\n`;
            md += `| 🔒 Security | ${breakdown.security ?? 'N/A'}/5 |\n`;
            md += `| ✔️ Correctness | ${breakdown.correctness ?? 'N/A'}/5 |\n`;
            md += `| ⚡ Performance | ${breakdown.performance ?? 'N/A'}/5 |\n`;
            md += `| 🔧 Maintainability | ${breakdown.maintainability ?? 'N/A'}/5 |\n`;
            md += `| 📐 Best Practices | ${breakdown.best_practices ?? 'N/A'}/5 |\n\n`;
            if (review.score_rationale) md += `> ${review.score_rationale}\n\n`;

            md += `**Risk Level:** ${riskEmoji} ${review.risk_level || 'N/A'}\n\n`;
            md += `## 📝 Summary\n${review.summary || 'N/A'}\n\n`;

            if (mustFix.length > 0) {
              md += `## 🚫 Must-Fix Issues (${mustFix.length})\n\n`;
              for (const issue of mustFix) {
                const sevEmoji = issue.severity === 'CRITICAL' ? '🔴' : '🟠';
                const location = issue.line_reference ? `\`${issue.file}:${issue.line_reference}\`` : `\`${issue.file}\``;
                md += `<details>\n<summary>${sevEmoji} <b>${issue.title}</b> — ${location}</summary>\n\n`;
                md += `**Severity:** ${issue.severity} &nbsp; **Category:** ${issue.category}\n\n`;
                if (issue.failure_mode) md += `**Failure mode:** ${issue.failure_mode}\n\n`;
                md += `**Detail:**\n${issue.description}\n\n`;
                md += `**Fix:**\n${issue.fix}\n\n`;
                md += `</details>\n\n`;
              }
            } else {
              md += `## ✅ No Must-Fix Issues\nNo CRITICAL or HIGH severity issues found.\n\n`;
            }

            if (advisory.length > 0) {
              md += `## 🔵 Advisory Issues (non-blocking)\n\n`;
              for (const issue of advisory) {
                const sevEmoji = issue.severity === 'MEDIUM' ? '🟡' : '🔵';
                const location = issue.line_reference ? `\`${issue.file}:${issue.line_reference}\`` : `\`${issue.file}\``;
                md += `<details>\n<summary>${sevEmoji} <b>${issue.title}</b> — ${location}</summary>\n\n`;
                md += `**Category:** ${issue.category}\n\n${issue.description}\n\n**Suggestion:** ${issue.fix}\n\n`;
                md += `</details>\n\n`;
              }
            }

            if (review.test_evidence) {
              md += `## 🧪 Test Evidence\n`;
              md += review.test_evidence.found
                ? `${review.test_evidence.detail}\n\n`
                : `> ⚠️ No test results visible in this diff. Not required, but helpful before merge.\n\n`;
            }

            if (review.best_practices_notes?.length > 0) {
              md += `## 💡 Best Practices (non-blocking)\n`;
              for (const note of review.best_practices_notes.slice(0, 3)) md += `- ${note}\n`;
              md += `\n`;
            }

            return md.trim();
          }

          async function main() {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
              },
              body: JSON.stringify({
                model: 'claude-sonnet-5',
                // Bumped from 16000: adaptive thinking now shares this budget, so
                // there needs to be enough headroom left for the full JSON output
                // even after Claude spends some of it deliberating.
                max_tokens: 30000,
                // Adaptive thinking with effort:medium keeps some reasoning depth
                // (helps on subtler bugs) while biasing away from the kind of
                // open-ended deliberation that previously consumed the entire
                // token budget on a complex diff before any review text was
                // written (stop_reason: max_tokens, empty thinking block, no
                // text output at all).
                thinking: { type: 'adaptive' },
                output_config: { effort: 'medium' },
                system: systemPrompt,
                messages: [{ role: 'user', content: userPrompt }],
              }),
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Anthropic API error ${response.status}: ${errText}`);
            }

            const data = await response.json();

            if (data.stop_reason === 'refusal') {
              fs.writeFileSync('/tmp/review.txt', '⚠️ Claude declined to review this diff (safety classifier refusal). This is usually a false positive on security-adjacent code — re-run the workflow to retry.');
              console.log('Claude refused the request (stop_reason: refusal). Wrote fallback message.');
              return;
            }

            const textBlock = data.content?.find((block) => block.type === 'text');

            if (!textBlock) {
              throw new Error(`No text content in Claude response. stop_reason: ${data.stop_reason}, content: ${JSON.stringify(data.content)}`);
            }

            let review;
            try {
              const cleaned = textBlock.text.replace(/^```json\n?|\n?```$/g, '').trim();
              review = JSON.parse(cleaned);
            } catch (err) {
              if (data.stop_reason === 'max_tokens') {
                fs.writeFileSync('/tmp/review.txt', '⚠️ The review was too long and got cut off before it finished (hit the token limit). This usually means the PR has many findings — try splitting it into smaller PRs, or re-run the workflow.');
                console.log('Response truncated at max_tokens before JSON completed. Wrote fallback message.');
                return;
              }
              console.error('Failed to parse Claude response as JSON. Raw text:', textBlock.text);
              throw err;
            }

            fs.writeFileSync('/tmp/review.txt', formatReviewComment(review));
            fs.writeFileSync('/tmp/review.json', JSON.stringify(review));
            console.log(`Review written to /tmp/review.txt. Score: ${review.score}/5, risk: ${review.risk_level}`);
          }

          main().catch((err) => {
            // Catch-all: never let an unhandled error kill the job with no PR feedback.
            // Full details go to the Action log; the PR comment gets a short, honest notice.
            console.error('Claude review failed with an unexpected error:');
            console.error(err.stack || err.message || String(err));
            fs.writeFileSync(
              '/tmp/review.txt',
              `⚠️ The automated review could not be completed due to an unexpected error: ${err.message || String(err)}\n\nCheck the "Run Claude code review" step logs in the Actions run for full details.`
            );
          });
          REVIEW_SCRIPT_EOF

      - name: Run Claude code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ toJSON(github.event.pull_request.title) }}
        run: node /tmp/claude-review.js /tmp/pr.diff

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');

            const body = [
              '## Automated Code Review 🤖',
              '',
              review,
              '',
              '---',
              '*Reviewed by [Claude](https://claude.ai)*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            // Inline review comments for CRITICAL/HIGH (must-fix) issues.
            if (!fs.existsSync('/tmp/review.json')) return;

            const parsedReview = JSON.parse(fs.readFileSync('/tmp/review.json', 'utf8'));
            const mustFixIssues = (parsedReview.issues || []).filter(
              (issue) => (issue.severity === 'CRITICAL' || issue.severity === 'HIGH') && issue.file && issue.line_reference
            );

            if (mustFixIssues.length === 0) return;

            const INLINE_MARKER = '<!-- claude-inline-review -->';

            function parseLineRef(ref) {
              const match = /^L(\d+)(?:-L(\d+))?$/.exec(ref || '');
              if (!match) return null;
              const start = parseInt(match[1], 10);
              const end = match[2] ? parseInt(match[2], 10) : start;
              return end > start ? { start_line: start, start_side: 'RIGHT', line: end } : { line: start };
            }

            // Clean up inline comments from previous runs on this PR to avoid duplicates on re-push.
            const existingComments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            for (const comment of existingComments.data) {
              if (comment.user?.type === 'Bot' && comment.body.includes(INLINE_MARKER)) {
                try {
                  await github.rest.pulls.deleteReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                } catch (err) {
                  console.log(`Could not delete stale inline comment ${comment.id}: ${err.message}`);
                }
              }
            }

            const headSha = context.payload.pull_request.head.sha;
            const MAX_INLINE_COMMENTS = 15;

            for (const issue of mustFixIssues.slice(0, MAX_INLINE_COMMENTS)) {
              const lineInfo = parseLineRef(issue.line_reference);
              if (!lineInfo) continue;

              const sevEmoji = issue.severity === 'CRITICAL' ? '🔴' : '🟠';
              const bodyLines = [`${sevEmoji} **${issue.severity}: ${issue.title}**`, ''];
              if (issue.failure_mode) bodyLines.push(`**Failure mode:** ${issue.failure_mode}`, '');
              bodyLines.push(`**Fix:** ${issue.fix}`, '', INLINE_MARKER);
              const commentBody = bodyLines.join('\n');

              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: headSha,
                  path: issue.file,
                  side: 'RIGHT',
                  body: commentBody,
                  ...lineInfo
                });
              } catch (err) {
                console.log(`Could not post inline comment on ${issue.file}:${issue.line_reference} — ${err.message}`);
              }
            }
